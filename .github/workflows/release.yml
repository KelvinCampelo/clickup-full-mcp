name: Release

# Fully automated releases:
#   1. release-please keeps a "chore(main): release X.Y.Z" PR up to date from Conventional Commits
#      (CHANGELOG.md, package.json and server.json versions).
#   2. Merging that PR creates the tag + GitHub release, and the publish job ships it to npm
#      (trusted publishing, with provenance), GHCR (multi-arch image) and the MCP Registry.
# Release PRs that only contain automated changes (ClickUp spec updates, dependency bumps) merge themselves.
#
# Publishing lives in this file on purpose: npm trusted publishing is bound to release.yml, and tags created
# with GITHUB_TOKEN don't trigger other workflows. The schedule picks up merges made by bots, which don't
# trigger push workflows either.
on:
  push:
    branches: [main]
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Re-publish an existing release tag (e.g. v2.1.0) to npm, GHCR and the MCP Registry"
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch CI on the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.rp.outputs.pr
        with:
          fetch-depth: 0

      - name: Run CI on the release PR; auto-merge it when it only contains automated changes
        if: steps.rp.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          branch="$(jq -r .headBranchName <<<"$PR_JSON")"
          number="$(jq -r .number <<<"$PR_JSON")"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)"
          echo "Commits since $last:"; git log --format='  %s' "$last..HEAD"
          # Automated = spec updates, dependency bumps and housekeeping. Anything else (or a breaking "!") needs a human.
          human="$(git log --format=%s "$last..HEAD" | grep -cvE '^((feat|fix|chore)\(spec\)|fix\(deps\)|(chore|ci|build|test|docs)(\([^)]*\))?): ' || true)"
          if [ "$human" -gt 0 ]; then
            echo "Release PR #$number has human-authored changes: leaving it for review."
          else
            echo "Release PR #$number only contains automated changes: enabling auto-merge."
            gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "$number"
          fi

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + MCP Registry OIDC login
      packages: write # GHCR
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      IMAGE: ghcr.io/kelvincampelo/clickup-full-mcp
      MCP_PUBLISHER_VERSION: v1.8.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Tag, package.json and server.json versions match
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$TAG" ] || { echo "::error::Tag $TAG does not match package.json version $v"; exit 1; }
          node -e '
            const s = require("./server.json"), p = require("./package.json");
            const bad = s.packages.filter((x) =>
              x.registryType === "oci"
                ? "version" in x || !x.identifier.endsWith(":" + p.version)
                : x.version !== p.version
            );
            if (s.name !== p.mcpName || s.version !== p.version || bad.length) {
              console.error("::error::server.json name/version out of sync with package.json");
              process.exit(1);
            }'
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Publish to npm (trusted publishing, with provenance)
        run: |
          if [ -n "$(npm view "clickup-full-mcp@$VERSION" version 2>/dev/null)" ]; then
            echo "clickup-full-mcp@$VERSION is already on npm, skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Wait until npm serves the new version (the MCP Registry validates against it)
        run: |
          for i in $(seq 1 60); do
            if [ "$(npm view "clickup-full-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ] &&
              curl -fsI "https://registry.npmjs.org/clickup-full-mcp/-/clickup-full-mcp-$VERSION.tgz" >/dev/null; then
              echo "npm serves clickup-full-mcp@$VERSION"; exit 0
            fi
            sleep 15
          done
          echo "::error::npm still doesn't serve clickup-full-mcp@$VERSION after 15 minutes"; exit 1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
          labels: |
            org.opencontainers.image.title=clickup-full-mcp
            org.opencontainers.image.description=MCP server for the complete ClickUp API
            io.modelcontextprotocol.server.name=io.github.KelvinCampelo/clickup-full-mcp
      - id: push
        name: Build and push multi-arch image to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign GHCR image with Cosign (keyless OIDC)
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Publish to the MCP Registry
        run: |
          name="$(node -p "require('./server.json').name")"
          if curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=$name&version=$VERSION" | grep -q "\"version\":\"$VERSION\""; then
            echo "$name $VERSION is already in the MCP Registry, skipping."
          else
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish
          fi
