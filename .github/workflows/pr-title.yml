name: PR title

# PRs are squash-merged, so the title becomes the commit message that release-please reads.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Title follows Conventional Commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            TITLE="$PR_TITLE"
          else
            TITLE="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json title --jq '.[0].title')"
          fi
          if [ -z "$TITLE" ] || [ "$TITLE" = "null" ]; then
            echo "::error::No open PR found for ref '$GITHUB_REF_NAME'."
            exit 1
          fi
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|perf|docs|refactor|test|build|ci|chore|revert|style)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix: handle empty task lists' or 'feat(docs): ...'. It becomes the squash commit and decides the next version."
            exit 1
          fi
