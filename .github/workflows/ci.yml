name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, typecheck, generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - name: Generated operations and tool docs are up to date with spec/
        run: |
          npm run generate
          if [ -n "$(git status --porcelain -- src/generated docs/tools README.md package.json server.json llms.txt)" ]; then
            git status --short -- src/generated docs/tools README.md package.json server.json llms.txt
            echo "::error::Generated files are stale. Run 'npm run generate' and commit the result."
            exit 1
          fi
      - name: Validate server.json
        run: |
          node -e '
            const fs = require("node:fs");
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const fail = (msg) => { console.error("::error::server.json: " + msg); process.exit(1); };
            if (!s.$schema || !s.title || !s.description) fail("missing required top-level fields");
            if (s.name !== p.mcpName) fail(`name (${s.name}) !== package.json mcpName (${p.mcpName})`);
            if (s.version !== p.version) fail(`version (${s.version}) !== package.json version (${p.version})`);
            if (!s.repository?.url || !s.repository?.source || !s.repository?.id) fail("missing repository fields (url, source, id)");
            if (!Array.isArray(s.icons) || s.icons.length === 0) fail("missing icons");
            if (!Array.isArray(s.packages) || s.packages.length === 0) fail("missing packages");
            if (!s.packages.some((x) => x.registryType === "npm")) fail("missing npm package");
            if (!s.packages.some((x) => x.registryType === "oci")) fail("missing oci package");
            for (const pkg of s.packages) {
              if (!pkg.registryType || !pkg.identifier || !pkg.transport?.type) fail(`package missing required fields: ${JSON.stringify(pkg)}`);
              if (pkg.registryType === "oci") {
                if ("version" in pkg) fail("oci package must not specify version (embed it in identifier)");
                if (!pkg.identifier.endsWith(":" + p.version)) fail(`oci identifier (${pkg.identifier}) does not end with :${p.version}`);
              } else if (pkg.version !== p.version) {
                fail(`${pkg.registryType} package version (${pkg.version}) !== package.json version (${p.version})`);
              }
            }
            console.log(`server.json OK (${s.name}@${s.version}, ${s.packages.length} packages)`);
          '
      - name: Package contents
        run: npm pack --dry-run

  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t clickup-full-mcp .
      - name: Smoke test (--version and MCP tools/list over stdio)
        run: |
          docker run --rm clickup-full-mcp --version
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 20 docker run -i --rm -e CLICKUP_API_TOKEN=pk_test clickup-full-mcp > out.jsonl || true
          cat out.jsonl
          grep -q '"clickup_call_operation"' out.jsonl

  # Single required status check for branch protection: green only if every job above succeeded.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, docker]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
